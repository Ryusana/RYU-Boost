name: RYUBoost
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
packages:
  WireGuard:
    url: https://git.zx2c4.com/wireguard-apple
    branch: master
targets:
  RYUBoost:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: RYU Boost
        RYUKeychainGroup: $(AppIdentifierPrefix)com.ryu.boost.shared
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryu.boost
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    dependencies:
      - target: RYUTunnel
        embed: true
  RYUTunnel:
    type: app-extension
    platform: iOS
    sources: [Tunnel, Shared]
    info:
      path: Tunnel/Info.plist
      properties:
        RYUKeychainGroup: $(AppIdentifierPrefix)com.ryu.boost.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryu.boost.tunnel
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: WireGuard
        product: WireGuardKit
